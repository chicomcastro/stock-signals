name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + integration tests (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run vitest with coverage
        run: npm run test:coverage
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: Post coverage report to PR
        if: github.event_name == 'pull_request' && always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          name: "Coverage (unit + integration)"

  e2e:
    name: End-to-end tests + screenshots
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: npm run test:e2e
        env:
          CI: "1"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/**/*.png
          retention-days: 14
      - name: Collect screenshots for PR comment
        if: github.event_name == 'pull_request' && always()
        run: |
          mkdir -p _comment_screenshots
          find test-results -name "*.png" ! -name "test-failed-*.png" | while read f; do
            name=$(basename "$(dirname "$f")")-$(basename "$f")
            cp "$f" "_comment_screenshots/$name"
          done
          ls -la _comment_screenshots/ || true
      - name: Push screenshots to previews branch
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          BRANCH="ci-previews"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          DEST_DIR="pr-${PR_NUMBER}/${{ github.sha }}"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git config --global user.email "claude-ci-bot@users.noreply.github.com"
          git config --global user.name "claude-ci-bot"

          mkdir -p /tmp/previews
          cd /tmp/previews
          if ! git clone --depth=1 --branch "$BRANCH" "$REPO_URL" .; then
            git init
            git remote add origin "$REPO_URL"
            git checkout --orphan "$BRANCH"
            git rm -rf . 2>/dev/null || true
            echo "# CI previews" > README.md
            git add README.md
            git commit -m "init previews branch"
          fi

          mkdir -p "$DEST_DIR"
          if [ -d "$GITHUB_WORKSPACE/_comment_screenshots" ] && [ "$(ls -A $GITHUB_WORKSPACE/_comment_screenshots)" ]; then
            cp "$GITHUB_WORKSPACE"/_comment_screenshots/*.png "$DEST_DIR/" || true
            git add "$DEST_DIR"
            git commit -m "screenshots for PR #${PR_NUMBER} @ ${{ github.sha }}" || true
            git push -u origin "$BRANCH"
          else
            echo "No screenshots to push"
          fi
      - name: Post screenshots comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '_comment_screenshots';
            if (!fs.existsSync(dir)) {
              console.log('No screenshots dir');
              return;
            }
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.png')).sort();
            if (files.length === 0) {
              console.log('No screenshots');
              return;
            }
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const sha = process.env.COMMIT_SHA;
            const prNumber = process.env.PR_NUMBER;
            const base = `https://raw.githubusercontent.com/${repo}/ci-previews/pr-${prNumber}/${sha}`;

            const groups = {};
            for (const f of files) {
              const m = f.match(/^(.*?)-(desktop|mobile)-(.+\.png)$/);
              const view = m ? m[2] : 'misc';
              const test = m ? m[1] : f;
              const filename = m ? m[3] : f;
              groups[test] = groups[test] || {};
              groups[test][view] = { url: `${base}/${f}`, filename };
            }

            let body = '## E2E screenshots\n\n';
            body += `Total: **${files.length}** captures · Commit \`${sha.slice(0,7)}\`\n\n`;
            body += '| Scenario | Desktop (1280×800) | Mobile (Pixel 7) |\n';
            body += '|---|---|---|\n';
            for (const [test, views] of Object.entries(groups)) {
              const d = views.desktop ? `<img src="${views.desktop.url}" width="380">` : '—';
              const m = views.mobile ? `<img src="${views.mobile.url}" width="200">` : '—';
              body += `| \`${test}\` | ${d} | ${m} |\n`;
            }
            body += `\n<sub>Hospedados em \`ci-previews\` branch. Run #${context.runId}.</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(prNumber), per_page: 100
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.startsWith('## E2E screenshots'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(prNumber), body
              });
            }
