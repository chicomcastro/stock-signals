<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical_url}}">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <script src="/chart.umd.js"></script>
  <script src="/js/app-shell.js" defer></script>
</head>
<body>
  {{app_shell}}

  <main class="container">
    <header style="margin-bottom:16px" class="fade-up">
      <h1>Meus favoritos</h1>
      <p style="color:var(--muted);margin:4px 0 0">Sua watchlist salva no navegador. Toque em um ativo para abrir.</p>
    </header>

    <div id="emptyState" class="card card--quiet" style="text-align:center;padding:32px" hidden>
      <div style="font-size:32px;margin-bottom:8px">⭐</div>
      <p style="margin:0">Você ainda não favoritou nenhum ativo. Abra um ativo e toque em "Favoritar".</p>
      <a href="/" class="btn btn--primary" style="margin-top:16px">Explorar ativos</a>
    </div>

    <div id="favoritesGrid" class="signals-day"></div>

    <section style="margin-top:32px" class="card card--quiet">
      <h2 style="margin-top:0;font-size:15px">💡 Dica</h2>
      <p style="margin:0;color:var(--text-2);font-size:13px">Quer receber por e-mail quando um sinal aparecer? <a href="/alertas">Configure alertas grátis</a>.</p>
    </section>
  </main>

  <script>
    const SIGNAL_BADGE = {
      entry: { text: 'positivo', cls: 'sig-chip--up' },
      exit: { text: 'negativo', cls: 'sig-chip--down' },
      neutral: { text: 'neutro', cls: 'sig-chip--neutral' },
    };

    function loadFavorites() {
      try { return JSON.parse(localStorage.getItem('stockFavorites') || '{}'); }
      catch (_) { return {}; }
    }

    function saveFavorites(f) { localStorage.setItem('stockFavorites', JSON.stringify(f)); }

    function removeFavorite(ticker) {
      const f = loadFavorites();
      delete f[ticker];
      saveFavorites(f);
      render();
    }

    async function loadCardData(ticker) {
      try {
        const res = await fetch('/data/' + encodeURIComponent(ticker) + '?period=3M');
        if (!res.ok) return null;
        return await res.json();
      } catch (_) { return null; }
    }

    function lastSignals(data) {
      if (!data || !data.analysis || data.analysis.length === 0) return null;
      const a = data.analysis[data.analysis.length - 1];
      return a;
    }

    function lastPrice(data) {
      if (!data || !data.closePrices) return null;
      return data.closePrices[data.closePrices.length - 1];
    }

    function priceChange(data) {
      if (!data || !data.closePrices || data.closePrices.length < 2) return null;
      const last = data.closePrices[data.closePrices.length - 1];
      const prev = data.closePrices[data.closePrices.length - 2];
      if (last == null || prev == null || prev === 0) return null;
      return (last - prev) / prev;
    }

    async function buildCard(ticker, name) {
      const card = document.createElement('div');
      card.className = 'signal-card fade-up';
      card.innerHTML = `
        <div class="signal-card__header" style="justify-content:space-between">
          <a href="/${encodeURIComponent(ticker)}" style="text-decoration:none;color:inherit">
            <strong>${ticker}</strong>
            <small style="color:var(--muted);font-weight:400">${name || ''}</small>
          </a>
          <button class="btn btn--ghost btn--sm" data-remove="${ticker}" aria-label="Remover">✕</button>
        </div>
        <div class="signal-card__sub" data-status>Carregando…</div>
        <div data-mini-chart style="height:80px;margin-top:8px"></div>
        <div data-signals style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px"></div>
      `;
      card.querySelector('[data-remove]').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        removeFavorite(ticker);
      });
      const data = await loadCardData(ticker);
      const statusEl = card.querySelector('[data-status]');
      const a = lastSignals(data);
      if (!data || !a) {
        statusEl.textContent = 'Sem dados ainda';
        return card;
      }
      const price = lastPrice(data);
      const change = priceChange(data);
      const cur = data.ticker && data.ticker.endsWith('.SA') ? 'R$ ' : '';
      const changeStr = change == null ? '' : ` <span style="color:${change >= 0 ? 'var(--accent-up)' : 'var(--accent-down)'};font-weight:600">${change >= 0 ? '+' : ''}${(change * 100).toFixed(2)}%</span>`;
      statusEl.innerHTML = `<strong>${cur}${price == null ? '—' : price.toFixed(2)}</strong>${changeStr}`;

      const sigs = card.querySelector('[data-signals]');
      [{ s: a.price.signal, label: 'preço' }, { s: a.rsi.signal, label: 'RSI' }, { s: a.macd.signal, label: 'MACD' }, { s: a.cross.signal, label: 'tend.' }].forEach(({ s, label }) => {
        const b = SIGNAL_BADGE[s] || SIGNAL_BADGE.neutral;
        const chip = document.createElement('span');
        chip.className = 'sig-chip ' + b.cls;
        chip.textContent = label + ': ' + b.text;
        sigs.appendChild(chip);
      });

      // Mini-sparkline
      const chartEl = card.querySelector('[data-mini-chart]');
      const canvas = document.createElement('canvas');
      chartEl.appendChild(canvas);
      const labels = data.dates.map(d => new Date(d).toLocaleDateString('pt-BR'));
      new Chart(canvas.getContext('2d'), {
        type: 'line',
        data: {
          labels,
          datasets: [{ data: data.closePrices, borderColor: change >= 0 ? '#10b981' : '#ef4444', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.1 }],
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          scales: { x: { display: false }, y: { display: false } },
          elements: { point: { radius: 0 } },
        },
      });

      return card;
    }

    async function render() {
      const favs = loadFavorites();
      const grid = document.getElementById('favoritesGrid');
      const empty = document.getElementById('emptyState');
      grid.innerHTML = '';
      const entries = Object.entries(favs);
      if (entries.length === 0) {
        empty.hidden = false;
        return;
      }
      empty.hidden = true;
      for (const [ticker, name] of entries) {
        const card = await buildCard(ticker, name);
        grid.appendChild(card);
      }
    }

    render();
  </script>
</body>
</html>
