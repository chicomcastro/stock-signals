<header class="app-header" role="banner">
  <a href="/" class="app-header__brand" aria-label="Stock Signals — início">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="var(--brand)"/>
      <path d="M5 22 L11 14 L16 19 L22 9 L27 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span>Stock Signals</span>
  </a>
  <nav class="app-header__nav" aria-label="Navegação principal">
    <a href="/" data-nav="home">Início</a>
    <a href="/sinais" data-nav="sinais">Sinais do dia</a>
    <a href="/favorites" data-nav="favoritos">Favoritos</a>
    <a href="/alertas" data-nav="alertas">Alertas</a>
  </nav>
  <div class="app-header__spacer"></div>
  <button class="app-header__action" id="globalSearchBtn" aria-label="Buscar ativo">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
  </button>
  <button class="app-header__action" id="themeToggleBtn" aria-label="Alternar tema escuro">
    <svg id="themeIconLight" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
    </svg>
    <svg id="themeIconDark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
    </svg>
  </button>
</header>

<nav class="bottom-nav" aria-label="Navegação inferior">
  <a href="/" class="bottom-nav__item" data-nav="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>
    </svg>
    <span>Início</span>
  </a>
  <a href="/sinais" class="bottom-nav__item" data-nav="sinais">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 17 9 11 13 15 21 7"/><path d="M14 7h7v7"/>
    </svg>
    <span>Sinais</span>
  </a>
  <a href="/buscar" class="bottom-nav__item" data-nav="buscar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <span>Buscar</span>
  </a>
  <a href="/favorites" class="bottom-nav__item" data-nav="favoritos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/>
    </svg>
    <span>Favoritos</span>
  </a>
  <a href="/alertas" class="bottom-nav__item" data-nav="alertas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>
    </svg>
    <span>Alertas</span>
  </a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="searchModal" class="search-modal" aria-hidden="true" hidden>
  <div class="search-modal__backdrop" data-close-modal></div>
  <div class="search-modal__panel" role="dialog" aria-modal="true" aria-label="Buscar ativo">
    <input id="globalSearchInput" class="input input--search" type="search" placeholder="Buscar (ex: Petrobras, AAPL, BTC-USD)" autocomplete="off">
    <div id="globalSearchResults" class="search-results" role="listbox"></div>
    <div class="search-modal__hint">Pressione <kbd>/</kbd> para abrir · <kbd>Esc</kbd> para fechar</div>
  </div>
</div>
